name: Apply QR update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-qr-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false

      - name: Apply uploaded QR update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          farmer = Path("app/farmer-views.tsx")
          source = farmer.read_text()

          import_anchor = 'import { EmptyState,Picker,Field,Status,Submit,SectionTitle } from "@/components/mandi-ui";'
          qr_import = 'import { TokenQr } from "@/components/token-qr";'
          if qr_import not in source:
              if import_anchor not in source:
                  raise SystemExit("Could not find farmer-view import anchor")
              source = source.replace(import_anchor, import_anchor + "\n" + qr_import, 1)

          active_old = '<Status status={active.status} hi={hi}/></div><h2>{active.token}</h2><div className="pass-fields">'
          active_new = '<Status status={active.status} hi={hi}/></div><div className="token-identity"><div className="token-identity-text"><h2>{active.token}</h2><p className="token-use-stages">{t("Entry · Weighing · Procurement · Exit","प्रवेश · तौल · खरीद · निकास")}</p></div><TokenQr token={active.token} hi={hi}/></div><div className="pass-fields">'
          if active_old in source:
              source = source.replace(active_old, active_new, 1)
          elif active_new not in source:
              raise SystemExit("Could not find active-token update anchor")

          detail_old = '<Status status={b.status} hi={hi}/></div><h2>{b.token}</h2><p>{b.farmer_name} · {b.village}</p><div className="pass-fields">'
          detail_new = '<Status status={b.status} hi={hi}/></div><div className="token-identity"><div className="token-identity-text"><h2>{b.token}</h2><p>{b.farmer_name} · {b.village}</p><p className="token-use-stages">{t("Entry · Weighing · Procurement · Exit","प्रवेश · तौल · खरीद · निकास")}</p></div><TokenQr token={b.token} hi={hi}/></div><div className="pass-fields">'
          if detail_old in source:
              source = source.replace(detail_old, detail_new, 1)
          elif detail_new not in source:
              raise SystemExit("Could not find booking-detail update anchor")

          farmer.write_text(source)

          qr = '''type TokenQrProps = {
            token: string;
            hi?: boolean;
          };

          const GRID_SIZE = 29;
          const QUIET_ZONE = 4;

          function tokenPattern(token: string) {
            // Presentation-only geometry: this is not an encoded QR payload or credential.
            // The token is the only seed, so status changes never change the graphic.
            let seed = 2166136261;
            for (let i = 0; i < token.length; i++) {
              seed = Math.imul(seed ^ token.charCodeAt(i), 16777619) >>> 0;
            }

            const squares: string[] = [];
            const finders = [[0, 0], [GRID_SIZE - 7, 0], [0, GRID_SIZE - 7]];

            for (let y = 0; y < GRID_SIZE; y++) {
              for (let x = 0; x < GRID_SIZE; x++) {
                const finder = finders.find(([left, top]) =>
                  x >= left - 1 && x <= left + 7 && y >= top - 1 && y <= top + 7
                );
                let filled: boolean;

                if (finder) {
                  const dx = x - finder[0];
                  const dy = y - finder[1];
                  filled = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6 &&
                    (dx === 0 || dx === 6 || dy === 0 || dy === 6 ||
                      (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
                } else if (x === 8 || y === 8) {
                  // Leave the format-information bands blank; nothing can authorize entry.
                  filled = false;
                } else {
                  seed ^= seed << 13;
                  seed ^= seed >>> 17;
                  seed ^= seed << 5;
                  filled = (seed >>> 0) % 2 === 0;
                }

                if (filled) squares.push(`M${x + QUIET_ZONE},${y + QUIET_ZONE}h1v1h-1z`);
              }
            }

            return squares.join("");
          }

          export function TokenQr({ token, hi = false }: TokenQrProps) {
            const label = hi ? "टोकन QR" : "Token QR";
            const size = GRID_SIZE + QUIET_ZONE * 2;

            return (
              <figure className="token-qr">
                <svg
                  viewBox={`0 0 ${size} ${size}`}
                  width="148"
                  height="148"
                  role="img"
                  aria-label={`${label}: ${token}`}
                  focusable="false"
                  shapeRendering="crispEdges"
                >
                  <rect width={size} height={size} fill="#ffffff" />
                  <path d={tokenPattern(token)} fill="#143c2b" />
                </svg>
                <figcaption>{label}</figcaption>
              </figure>
            );
          }
          '''
          # Remove workflow indentation while preserving the uploaded component source.
          import textwrap
          Path("components/token-qr.tsx").write_text(textwrap.dedent(qr))

          css = Path("app/globals.css")
          styles = css.read_text()
          marker = "/* A token keeps the same visual identifier across its procurement record. */"
          if marker not in styles:
              styles += '''\n\n/* A token keeps the same visual identifier across its procurement record. */
          .token-identity {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 22px 0 26px;
          }
          .token-identity-text { flex: 1; min-width: 0; }
          .token-pass .token-identity h2 { margin: 0 0 12px; }
          .token-pass .token-identity p { margin: 0 0 10px; overflow-wrap: anywhere; }
          .token-pass .token-identity .token-use-stages {
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
            color: #d4e7da;
          }
          .token-qr {
            margin: 0;
            width: 148px;
            flex: none;
            background: #ffffff;
            border: 1px solid #d6e4da;
            border-radius: 9px;
            overflow: hidden;
            color: #143c2b;
            break-inside: avoid;
          }
          .token-qr svg { display: block; width: 100%; height: auto; }
          .token-qr figcaption {
            padding: 0 8px 10px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            text-align: center;
            color: #143c2b;
          }
          @media (max-width: 480px) {
            .token-identity { flex-direction: column; align-items: flex-start; gap: 16px; }
            .token-identity-text { width: 100%; }
          }
          @media print {
            .token-identity { break-inside: avoid; }
            .token-qr { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
          }
          '''
              styles = textwrap.dedent(styles)
              css.write_text(styles)
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      - name: Commit verified update
        shell: bash
        run: |
          if git diff --quiet -- app/farmer-views.tsx app/globals.css components/token-qr.tsx; then
            echo "QR update is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/farmer-views.tsx app/globals.css components/token-qr.tsx
          git commit -m "Add QR visual to procurement passes"
          git push origin HEAD:main
